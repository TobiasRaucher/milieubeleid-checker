name: Data bijwerken (Tweede Kamer open data)

# Draait automatisch elke werkdag om 05:17 UTC (06:17 Nederlandse wintertijd).
# Handmatig kan ook: Actions > "Data bijwerken" > "Run workflow".
# Uitzetten? Zet een # voor de twee schedule-regels hieronder.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1-5"   # werkdagen om 05:17 UTC

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Data ophalen
        run: python3 pipeline/fetch_tk.py
      - name: Agendafeed maken
        run: python3 pipeline/maak_ics.py
      - name: Thema-lijst voor noscript
        run: node pipeline/themas_noscript.js
      - name: Wijzigingen opslaan
        run: |
          git config user.name "checker-bot"
          git config user.email "checker-bot@users.noreply.github.com"
          git add data/tk data/agenda.ics index.html
          if git diff --cached --quiet; then
            echo "Geen wijzigingen."
          else
            git commit -m "Data bijgewerkt $(date -u +%Y-%m-%d)"
            git push
          fi
